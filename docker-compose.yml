#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/crop-by-vincent:latest@sha256:78ee1330a232984630735f8fc489ec20c5f6315acef9a6d2d35cf6f21dc503b8
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3013:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
