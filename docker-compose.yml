#http
version: "3.8"

services:
  app:
    image: ghcr.io/mahn-ke/crop-by-vincent:latest@sha256:4b9a9acd52326e3de26db5415e654d9d6d27b718cfa0b00878bd2920039be5fd
    restart: on-failure:5
    environment:
      - PORT=3000
    ports:
      - "3013:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
